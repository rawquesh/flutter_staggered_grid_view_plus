name: flutter_staggered_grid_view_plus
description: A maintained successor and migration of flutter_staggered_grid_view providing a collection of Flutter grid layouts (staggered, masonry, quilted, woven, etc.) for current Flutter versions.
version: 1.0.0
homepage: https://github.com/rawquesh/flutter_staggered_grid_view_plus
repository: https://github.com/rawquesh/flutter_staggered_grid_view_plus
issue_tracker: https://github.com/rawquesh/flutter_staggered_grid_view_plus/issues

topics:
  - staggered-grid
  - masonry
  - grid
  - layout
  - widgets

environment:
  sdk: "^3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
